<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block t %}ExpertStream{% endblock %}</title><style>
:root{--bg:#070b14;--panel:#111a2c;--raise:#16213a;--line:#1f2d47;--ink:#eef2f8;--dim:#8d9ab3;--blue:#3987e5;--green:#19b07d;--warm:#f2c98a;--bad:#e66767;
--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--r:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
nav{height:64px;display:flex;align-items:center;gap:28px;padding:0 32px;border-bottom:1px solid var(--line)}
nav b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}nav a{color:var(--dim);text-decoration:none}nav a:hover,nav a.on{color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:48px 32px}h1{font:600 40px/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 10px}
h2{font:600 22px var(--f-display);margin:44px 0 16px}.sub{color:var(--dim);max-width:620px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
button,.btn{font:500 14px var(--f-body);background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
button.ghost{background:var(--raise);color:var(--ink);border:1px solid var(--line)}button.stop{background:var(--bad)}
code,pre,textarea,input{font-family:var(--f-mono);font-size:13px}.mono{font-family:var(--f-mono)}
</style>{% block head %}{% endblock %}</head><body>
<nav><b>ExpertStream <span style="color:var(--dim);font-weight:400">Trainer</span></b><a href="/" class="{{ 'on' if request.path == '/' }}">Notebook</a><a href="/moe" class="{{ 'on' if request.path == '/moe' }}">Train MoE</a><a href="{{site_url}}/run">Run</a><a href="{{site_url}}/">Plans</a>
<span style="margin-left:auto;color:var(--dim);font-size:13px">{% if user %}{{user.email}} · {{ sub or 'Expert Stream Starter' }} · <a href="{{site_url}}/" style="color:var(--warm)">Upgrade</a> · <a href="{{site_url}}/logout">Log out</a>{% endif %}</span></nav>
<main>{% block body %}{% endblock %}</main></body></html>
